<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rep">
<meta name="theme-color" content="#0b0b12">
<title>Rep · Workout</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff3d6e'/%3E%3Cstop offset='1' stop-color='%23ffb020'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='180' height='180' rx='40' fill='%230b0b12'/%3E%3Ctext x='90' y='122' font-family='Arial Black,Arial' font-weight='900' font-size='96' text-anchor='middle' fill='url(%23g)'%3ER%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#0b0b12;--card:#161622;--card2:#1e1e2e;--text:#f4f4f8;--dim:#8a8aa3;--a:#ff3d6e;--b:#ffb020;--ok:#2ee59d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 110px);min-height:100vh;
background:radial-gradient(600px 400px at 100% -10%,rgba(255,61,110,.22),transparent 60%),radial-gradient(500px 400px at -10% 10%,rgba(255,176,32,.14),transparent 60%),var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:30px;font-weight:900;margin:0;letter-spacing:-.5px;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--dim);font-size:13px;margin-top:2px}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.tabs{display:flex;gap:8px;margin:18px 0 14px;flex-wrap:wrap}
.tab{flex:1;min-width:90px;padding:12px 8px;border-radius:14px;background:var(--card);border:1px solid #2a2a3d;color:var(--dim);font-weight:800;font-size:15px;text-align:center}
.tab.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 6px 24px rgba(255,61,110,.35)}
.where{display:flex;gap:8px;margin-bottom:14px}
.pill{padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid #2a2a3d;color:var(--dim);font-size:13px;font-weight:700}
.pill.on{color:var(--text);border-color:var(--b)}
.ex{background:var(--card);border:1px solid #24243a;border-radius:20px;padding:16px;margin-bottom:12px;transition:.25s}
.ex.done{border-color:rgba(46,229,157,.6);background:linear-gradient(180deg,rgba(46,229,157,.08),var(--card))}
.exh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.name{font-size:18px;font-weight:800}
.scheme{color:var(--b);font-weight:700;font-size:13px;margin-top:3px}
.last{color:var(--dim);font-size:12px;margin-top:3px}
.wt{display:flex;align-items:center;gap:6px}
.wt input{width:72px;padding:9px 8px;border-radius:12px;border:1px solid #2f2f47;background:var(--card2);color:var(--text);font-size:17px;font-weight:800;text-align:center}
.wt small{color:var(--dim);font-size:12px}
.sets{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.set{width:54px;height:54px;border-radius:50%;border:2px solid #34344d;background:var(--card2);color:var(--dim);font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;position:relative;transition:transform .15s}
.set:active{transform:scale(.9)}
.set.on{border-color:transparent;color:#0b0b12;background:linear-gradient(135deg,var(--ok),#7cf5c8);box-shadow:0 0 18px rgba(46,229,157,.45)}
.set.on::after{content:"✓";position:absolute;font-size:22px}
.set.on b{opacity:0}
.reps{width:54px;font-size:11px;color:var(--dim);text-align:center;margin-top:4px}
.setwrap{display:flex;flex-direction:column;align-items:center}
.repsin{width:54px;margin-top:6px;padding:5px 2px;border-radius:9px;border:1px solid #2f2f47;background:var(--card2);color:var(--text);font-size:14px;font-weight:700;text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);background:rgba(11,11,18,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid #222235;display:flex;gap:10px;align-items:center}
.timer{flex:1;display:flex;align-items:center;gap:10px}
.tbtn{padding:12px 12px;border-radius:14px;background:var(--card);border:1px solid #2a2a3d;color:var(--text);font-weight:800;font-size:14px}
.clock{font-variant-numeric:tabular-nums;font-size:24px;font-weight:900;min-width:64px}
.clock.go{color:var(--b)}
.finish{padding:14px 18px;border-radius:14px;border:0;font-weight:900;font-size:15px;color:#fff;background:linear-gradient(135deg,var(--a),var(--b))}
.note{color:var(--dim);font-size:12px;line-height:1.45;margin:6px 2px 16px}
.hist{margin-top:22px}
.hist h3{font-size:15px;color:var(--dim);margin:0 0 8px;text-transform:uppercase;letter-spacing:1px}
.hrow{background:var(--card);border-radius:14px;padding:11px 14px;margin-bottom:8px;font-size:13px;color:var(--dim)}
.hrow b{color:var(--text)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 20px);transform:translate(-50%,-300%);opacity:0;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-weight:900;padding:12px 20px;border-radius:999px;transition:.35s;z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.show{transform:translate(-50%,0);opacity:1}
button{font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<header>
  <div><h1>REP</h1><div class="sub" id="dateline"></div></div>
  <div class="ring"><svg width="64" height="64"><circle cx="32" cy="32" r="27" stroke="#24243a" stroke-width="7" fill="none"/><circle id="prog" cx="32" cy="32" r="27" stroke="url(#gg)" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="169.6" stroke-dashoffset="169.6" style="transition:.4s"/><defs><linearGradient id="gg"><stop offset="0" stop-color="#ff3d6e"/><stop offset="1" stop-color="#ffb020"/></linearGradient></defs></svg><span id="pct">0%</span></div>
</header>
<div class="tabs" id="tabs"></div>
<div class="where"><button class="pill on" data-w="gym">🏋️ Life Time</button><button class="pill" data-w="home">🏠 Home</button></div>
<div class="note">Tap a circle when you finish a set and it starts your rest timer. Type the weight and the reps you actually hit. Hit the top of the range on every set and you add weight next time.</div>
<div id="list"></div>
<div class="hist"><h3>Recent sessions</h3><div id="hist"></div></div>
<div class="bar">
  <div class="timer"><span class="clock" id="clock">0:00</span><button class="tbtn" data-t="90">90s</button><button class="tbtn" data-t="150">2:30</button></div>
  <button class="finish" id="finish">Finish 💪</button>
</div>
<div class="toast" id="toast"></div>
<script>
const PLAN={
 gym:{
  A:[["Back Squat",3,"6–8"],["Bench Press",3,"6–8"],["Barbell Row",3,"8–10"],["Romanian Deadlift",2,"10"],["Hanging Leg Raise",3,"10–15"]],
  B:[["Deadlift",3,"5"],["Overhead Press",3,"6–8"],["Pull-ups",3,"max"],["Walking Lunges",2,"10/leg"],["Dips",2,"8–12"]],
  C:[["Leg Press",3,"10"],["Incline DB Press",3,"8–10"],["Lat Pulldown",3,"10"],["DB Lateral Raise",3,"12–15"],["Cable Crunch / Plank",3,"12 / 45s"]]},
 home:{
  A:[["DB Goblet Squat",3,"8–12"],["Dips",3,"6–10"],["One-Arm DB Row",3,"10/side"],["DB Romanian Deadlift",2,"12"],["Hanging Leg Raise",3,"10–15"]],
  B:[["DB Split Squat",3,"8/leg"],["DB Overhead Press",3,"8–10"],["Pull-ups",3,"max"],["BOSU Reverse Lunge",2,"10/leg"],["Push-ups",2,"max"]],
  C:[["DB Bulgarian Split Squat",3,"10/leg"],["DB Floor Press",3,"10–12"],["Chin-ups",3,"max"],["DB Lateral Raise",3,"12–15"],["BOSU Plank",3,"45s"]]}
};
const LS=k=>JSON.parse(localStorage.getItem(k)||"null"), SS=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let st=LS("rep_state")||{day:"A",where:"gym",sets:{},w:{},r:{}};
let last=LS("rep_last")||{}, hist=LS("rep_hist")||[];
const key=()=>st.where+st.day;
document.getElementById("dateline").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
function save(){SS("rep_state",st)}
function render(){
 const tabs=document.getElementById("tabs");tabs.innerHTML="";
 ["A","B","C"].forEach(d=>{const b=document.createElement("button");b.className="tab"+(st.day===d?" on":"");b.textContent="Day "+d;b.onclick=()=>{st.day=d;save();render()};tabs.appendChild(b)});
 document.querySelectorAll(".pill").forEach(p=>p.classList.toggle("on",p.dataset.w===st.where));
 const list=document.getElementById("list");list.innerHTML="";
 PLAN[st.where][st.day].forEach(([n,s,r],i)=>{
  const id=key()+i, done=(st.sets[id]||[]);
  const card=document.createElement("div");card.className="ex"+(done.filter(Boolean).length===s?" done":"");
  const lw=last[n];
  card.innerHTML=`<div class="exh"><div><div class="name">${n}</div><div class="scheme">${s} sets × ${r} reps</div>${lw?`<div class="last">Last: ${lw.w||"–"} lb · ${lw.r||""}</div>`:""}</div>
  <div class="wt"><input inputmode="decimal" placeholder="${lw&&lw.w?lw.w:"lb"}" value="${st.w[id]||""}"><small>lb</small></div></div><div class="sets"></div>`;
  card.querySelector("input").oninput=e=>{st.w[id]=e.target.value;save()};
  const sets=card.querySelector(".sets");
  for(let k=0;k<s;k++){
   const wrap=document.createElement("div");wrap.className="setwrap";
   const b=document.createElement("button");b.className="set"+(done[k]?" on":"");b.innerHTML=`<b>${k+1}</b>`;
   b.onclick=()=>{const a=st.sets[id]||[];a[k]=!a[k];st.sets[id]=a;save();if(a[k]){navigator.vibrate&&navigator.vibrate(30);startTimer(i<2&&st.where==="gym"?150:90)}render()};
   const ri=document.createElement("input");ri.className="repsin";ri.inputMode="numeric";ri.placeholder="reps";ri.value=(st.r[id]||[])[k]||"";
   ri.oninput=e=>{const a=st.r[id]||[];a[k]=e.target.value;st.r[id]=a;save()};
   wrap.appendChild(b);wrap.appendChild(ri);sets.appendChild(wrap);
  }
  list.appendChild(card);
 });
 progress();renderHist();
}
function progress(){
 const ex=PLAN[st.where][st.day];let t=0,d=0;
 ex.forEach(([n,s],i)=>{t+=s;d+=(st.sets[key()+i]||[]).filter(Boolean).length});
 const p=t?d/t:0;document.getElementById("prog").style.strokeDashoffset=169.6*(1-p);document.getElementById("pct").textContent=Math.round(p*100)+"%";
}
function renderHist(){
 const h=document.getElementById("hist");
 h.innerHTML=hist.length?hist.slice(0,6).map(x=>`<div class="hrow"><b>${x.date} · Day ${x.day}</b> (${x.where==="gym"?"Life Time":"Home"}) · ${x.sets} sets<br>${x.items.join(" · ")}</div>`).join(""):`<div class="hrow">No sessions yet. Go get the first one.</div>`;
}
document.querySelectorAll(".pill").forEach(p=>p.onclick=()=>{st.where=p.dataset.w;save();render()});
let tEnd=0,tInt=null;const clock=document.getElementById("clock");
function startTimer(sec){tEnd=Date.now()+sec*1000;clearInterval(tInt);tick();tInt=setInterval(tick,250)}
function tick(){const left=Math.max(0,Math.round((tEnd-Date.now())/1000));clock.textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");clock.classList.toggle("go",left>0);
 if(left<=0&&tInt){clearInterval(tInt);tInt=null;if(tEnd){toast("Rest's over. Next set 🔥");navigator.vibrate&&navigator.vibrate([200,100,200])}tEnd=0}}
document.querySelectorAll(".tbtn").forEach(b=>b.onclick=()=>startTimer(+b.dataset.t));
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
document.getElementById("finish").onclick=()=>{
 const ex=PLAN[st.where][st.day];let sets=0;const items=[];
 ex.forEach(([n],i)=>{const id=key()+i,c=(st.sets[id]||[]).filter(Boolean).length;sets+=c;
  const reps=(st.r[id]||[]).filter(Boolean).join("/");
  if(c){items.push(`${n} ${st.w[id]?st.w[id]+"lb ":""}${reps||c+" sets"}`);last[n]={w:st.w[id]||(last[n]&&last[n].w)||"",r:reps}}});
 if(!sets){toast("Check off a set first 😤");return}
 hist.unshift({date:new Date().toLocaleDateString(undefined,{month:"short",day:"numeric"}),day:st.day,where:st.where,sets,items});
 SS("rep_hist",hist.slice(0,50));SS("rep_last",last);
 ex.forEach((_,i)=>{const id=key()+i;delete st.sets[id];delete st.w[id];delete st.r[id]});
 st.day={A:"B",B:"C",C:"A"}[st.day];save();render();window.scrollTo({top:0,behavior:"smooth"});
 toast("Session logged. Beast mode 🏆");
};
render();
</script>
</body>
</html>
