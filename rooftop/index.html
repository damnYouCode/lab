<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Dart Dodger: a friendly rooftop game. Dodge the foam darts the robots toss, from sunrise to midnight!">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dart Dodger">
<meta name="theme-color" content="#120d22">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>Dart Dodger</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; color: #fff; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
    user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body { position: fixed; inset: 0; }
  #stage {
    position: fixed; inset: 0; box-sizing: border-box;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    display: flex; align-items: center; justify-content: center;
  }
  #fit { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #120d22; touch-action: none; }
  #ui { position: fixed; inset: 0; z-index: 2; touch-action: none; }
  .btn {
    position: absolute; box-sizing: border-box; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font: 800 13px/1.1 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    color: rgba(255,255,255,0.92); letter-spacing: 0.5px; text-align: center;
    background: rgba(20,14,40,0.42); border: 2px solid rgba(255,255,255,0.45);
    transition: background 80ms linear, opacity 120ms linear;
  }
  .btn span { display: block; font-size: 11px; font-weight: 700; opacity: 0.9; margin-top: 3px; }
  .btn svg { width: 18px; height: 18px; fill: currentColor; }
  .btn.hide { display: none; }
  .btn.locked { opacity: 0.55; border-style: dashed; }
  .btn.cool { background: rgba(60,60,80,0.55); border-color: rgba(255,255,255,0.3); }
  .btn.cool span { font-size: 20px; font-weight: 800; }
  .btn.ready { background: rgba(80,40,190,0.5); border-color: rgba(190,160,255,0.95); }
  .btn.active { background: rgba(60,200,255,0.5); border-color: rgba(200,245,255,0.95); }
  .btn.on { filter: brightness(1.5); }
  #bT { right: calc(env(safe-area-inset-right) + 12px); bottom: calc(env(safe-area-inset-bottom) + 12px);
        width: 104px; height: 104px; border-radius: 50%; font-size: 14px; }
  #bS { left: calc(env(safe-area-inset-left) + 12px); bottom: calc(env(safe-area-inset-bottom) + 12px);
        width: 84px; height: 84px; border-radius: 50%; }
  #bP { right: calc(env(safe-area-inset-right) + 10px); top: calc(env(safe-area-inset-top) + 10px);
        width: 46px; height: 46px; border-radius: 12px; }
  #bP svg { width: 20px; height: 20px; }
  .key { display: none; font-size: 10px; opacity: 0.7; margin-top: 2px; }
  body.desk .key { display: block; }
  body.desk #bT { width: 92px; height: 92px; }
  body.desk #bS { width: 78px; height: 78px; }
  #rotate {
    position: fixed; inset: 0; z-index: 10; display: none; background: #120d22;
    flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    font: 700 22px/1.3 -apple-system, system-ui, sans-serif; color: #ffd84a; text-align: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #rotate small { display: block; color: #9fe8ff; font-weight: 500; font-size: 15px; }
  #rotate svg { width: 96px; height: 96px; animation: tilt 1.8s ease-in-out infinite; }
  @keyframes tilt { 0%,30% { transform: rotate(0deg); } 60%,100% { transform: rotate(-90deg); } }
</style>
<style>#splash{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:#c98a4a url(splash-bg.jpg) center/cover;transition:opacity .6s}#splash img{width:min(44vmin,320px);height:auto;border-radius:22%;box-shadow:0 10px 40px rgba(0,0,0,.35)}#splash.gone{opacity:0;pointer-events:none}</style>
</head>
<body>
<div id="splash"><img src="splash-icon.png" alt="Dart Dodger"></div>
<script>setTimeout(function(){var s=document.getElementById('splash');s.classList.add('gone');setTimeout(function(){s.remove()},700)},1500)</script>
<div id="stage"><div id="fit"><canvas id="screen" width="640" height="360"></canvas></div></div>
<div id="ui">
  <div class="btn hide" id="bS"><div>SHIELD</div><span id="bSs">LOCKED</span><div class="key">[S]</div></div>
  <div class="btn hide" id="bT"><div>TELEPORT</div><span id="bTs">LOCKED</span><div class="key">[T]</div></div>
  <div class="btn" id="bP"><svg viewBox="0 0 10 10"><rect x="2" y="1.5" width="2.2" height="7"/><rect x="5.8" y="1.5" width="2.2" height="7"/></svg></div>
</div>
<div id="rotate">
  <svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2" fill="none" stroke="#ffd84a" stroke-width="1.6"/><circle cx="12" cy="18.5" r="1" fill="#ffd84a"/></svg>
  <div>Rotate your phone<small>Dart Dodger plays in landscape</small></div>
</div>
<script src="game.js"></script>
</body>
</html>
