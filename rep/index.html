<style>
:root{--bg:#0b0b12;--card:#161622;--card2:#1e1e2e;--text:#f4f4f8;--dim:#8a8aa3;--a:#ff3d6e;--b:#ffb020;--ok:#2ee59d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 110px);min-height:100vh;
background:radial-gradient(600px 400px at 100% -10%,rgba(255,61,110,.22),transparent 60%),radial-gradient(500px 400px at -10% 10%,rgba(255,176,32,.14),transparent 60%),var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:30px;font-weight:900;margin:0;letter-spacing:-.5px;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--dim);font-size:13px;margin-top:2px}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.tabs{display:flex;gap:8px;margin:18px 0 14px;flex-wrap:wrap}
.tab{flex:1;min-width:90px;padding:12px 8px;border-radius:14px;background:var(--card);border:1px solid #2a2a3d;color:var(--dim);font-weight:800;font-size:15px;text-align:center}
.tab.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 6px 24px rgba(255,61,110,.35)}
.where{display:flex;gap:8px;margin-bottom:14px}
.pill{padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid #2a2a3d;color:var(--dim);font-size:13px;font-weight:700}
.pill.on{color:var(--text);border-color:var(--b)}
.ex{background:var(--card);border:1px solid #24243a;border-radius:20px;padding:16px;margin-bottom:12px;transition:.25s}
.ex.done{border-color:rgba(46,229,157,.6);background:linear-gradient(180deg,rgba(46,229,157,.08),var(--card))}
.exh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.name{font-size:18px;font-weight:800}
.scheme{color:var(--b);font-weight:700;font-size:13px;margin-top:3px}
.last{color:var(--dim);font-size:12px;margin-top:3px}
.wt{display:flex;align-items:center;gap:6px}
.wt input{width:72px;padding:9px 8px;border-radius:12px;border:1px solid #2f2f47;background:var(--card2);color:var(--text);font-size:17px;font-weight:800;text-align:center}
.wt small{color:var(--dim);font-size:12px}
.sets{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.set{width:54px;height:54px;border-radius:50%;border:2px solid #34344d;background:var(--card2);color:var(--dim);font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;position:relative;transition:transform .15s}
.set:active{transform:scale(.9)}
.set.on{border-color:transparent;color:#0b0b12;background:linear-gradient(135deg,var(--ok),#7cf5c8);box-shadow:0 0 18px rgba(46,229,157,.45)}
.set.on::after{content:"✓";position:absolute;font-size:22px}
.set.on b{opacity:0}
.reps{width:54px;font-size:11px;color:var(--dim);text-align:center;margin-top:4px}
.setwrap{display:flex;flex-direction:column;align-items:center}
.repsin{width:54px;margin-top:6px;padding:5px 2px;border-radius:9px;border:1px solid #2f2f47;background:var(--card2);color:var(--text);font-size:14px;font-weight:700;text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);background:rgba(11,11,18,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid #222235;display:flex;gap:10px;align-items:center}
.timer{flex:1;display:flex;align-items:center;gap:10px}
.tbtn{padding:12px 12px;border-radius:14px;background:var(--card);border:1px solid #2a2a3d;color:var(--text);font-weight:800;font-size:14px}
.clock{font-variant-numeric:tabular-nums;font-size:24px;font-weight:900;min-width:64px}
.clock.go{color:var(--b)}
.finish{padding:14px 18px;border-radius:14px;border:0;font-weight:900;font-size:15px;color:#fff;background:linear-gradient(135deg,var(--a),var(--b))}
.note{color:var(--dim);font-size:12px;line-height:1.45;margin:6px 2px 16px}
.hist{margin-top:22px}
.hist h3{font-size:15px;color:var(--dim);margin:0 0 8px;text-transform:uppercase;letter-spacing:1px}
.hrow{background:var(--card);border-radius:14px;padding:11px 14px;margin-bottom:8px;font-size:13px;color:var(--dim)}
.hrow b{color:var(--text)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 20px);transform:translate(-50%,-300%);opacity:0;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-weight:900;padding:12px 20px;border-radius:999px;transition:.35s;z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.show{transform:translate(-50%,0);opacity:1}
button{font-family:inherit;cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:8}
.sheet.show{display:flex}
.panel{width:100%;background:var(--card);border-radius:24px 24px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px);border-top:1px solid #2a2a3d}
.panel h2{margin:0 0 4px;font-size:22px;font-weight:900}
.panel pre{white-space:pre-wrap;background:var(--card2);border-radius:14px;padding:12px;font-size:13px;color:var(--text);max-height:40vh;overflow:auto;font-family:ui-monospace,Menlo,monospace}
.big{width:100%;padding:16px;border-radius:16px;border:0;font-weight:900;font-size:17px;color:#fff;background:linear-gradient(135deg,var(--a),var(--b));margin-top:8px}
.ghost{width:100%;padding:13px;border-radius:16px;border:1px solid #2a2a3d;background:transparent;color:var(--dim);font-weight:800;font-size:15px;margin-top:8px}

.who{display:flex;align-items:flex-start;gap:8px;min-width:0;flex:1}
.demo{flex:none;width:102px;height:112px;padding:0;margin:-2px 0 0 -6px;border:1px solid #24243a;background:#0c0c16;border-radius:14px;overflow:hidden}
.demo .fig{width:102px;height:112px;display:block}
.zoom{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:12;align-items:center;justify-content:center;padding:24px}
.zoom.show{display:flex}
.zoombox{background:var(--card);border:1px solid #2a2a3d;border-radius:24px;padding:16px 16px 12px;width:min(340px,100%);text-align:center}
.zoombox h3{margin:0 0 8px;font-size:18px;font-weight:900}
.zoombox .fig{width:280px;height:308px;margin:0 auto;background:#0c0c16;border-radius:16px;display:block}
/*ANIMCSS*/
.fig .gnd{stroke:#3a3a52;stroke-width:2;fill:none;stroke-linecap:round}
.fig .b{stroke:#eee;stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .b.f{stroke:#8d8da3;stroke-width:3}
.fig .hd{stroke:#eee;stroke-width:3.2;fill:#0c0c16}
.fig .eq{stroke:#6c6c84;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .eqf{stroke:#6c6c84;stroke-width:1.6;fill:#262636;stroke-linejoin:round}
.fig .pl{stroke:#9a9ab2;stroke-width:2;fill:#3a3a50}
.fig .dbf{stroke:#c9c9d8;stroke-width:1;fill:#8e8ea6}
.fig .dbf.f{opacity:.55}
/*END ANIMCSS*/

</style>
</head>

<script>
const PLAN={
 gym:{
  A:[["Back Squat",3,"6–8"],["Bench Press",3,"6–8"],["Barbell Row",3,"8–10"],["Romanian Deadlift",2,"10"],["Hanging Leg Raise",3,"10–15"]],
  B:[["Deadlift",3,"5"],["Overhead Press",3,"6–8"],["Pull-ups",3,"max"],["Walking Lunges",2,"10/leg"],["Dips",2,"8–12"]],
  C:[["Leg Press",3,"10"],["Incline DB Press",3,"8–10"],["Lat Pulldown",3,"10"],["DB Lateral Raise",3,"12–15"],["Cable Crunch / Plank",3,"12 / 45s"]]},
 home:{
  A:[["DB Goblet Squat",3,"8–12"],["Dips",3,"6–10"],["One-Arm DB Row",3,"10/side"],["DB Romanian Deadlift",2,"12"],["Hanging Leg Raise",3,"10–15"]],
  B:[["DB Split Squat",3,"8/leg"],["DB Overhead Press",3,"8–10"],["Pull-ups",3,"max"],["BOSU Reverse Lunge",2,"10/leg"],["Push-ups",2,"max"]],
  C:[["DB Bulgarian Split Squat",3,"10/leg"],["DB Floor Press",3,"10–12"],["Chin-ups",3,"max"],["DB Lateral Raise",3,"12–15"],["BOSU Plank",3,"45s"]]}
};

//ANIMJS
// ---- exercise demos: pose table -> SVG (side view, figure faces right) ----
const LEN={t:28,n:4,h:7.5,r:6,ua:16,fa:15,th:22,sh:21,ft:8};
const R2=v=>Math.round(v*10)/10, D2R=Math.PI/180;
const add=(a,b,k=1)=>[a[0]+b[0]*k,a[1]+b[1]*k];
function ik(R,T,l1,l2,s){
  let dx=T[0]-R[0],dy=T[1]-R[1],d=Math.hypot(dx,dy)||.01;const ux=dx/d,uy=dy/d;
  d=Math.min(Math.max(d,Math.abs(l1-l2)+.05),l1+l2-.02);
  const a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-a*a));
  return [[R[0]+a*ux+s*h*uy,R[1]+a*uy-s*h*ux],[R[0]+d*ux,R[1]+d*uy]];
}
// pose: {P|S:[x,y], tor:deg from vertical (+ = lean toward +x), hd, legs:[{a|t, fa, k, f}], arms:[{w, e, f}]}
function side(p,s){
  const L={};for(const k in LEN)L[k]=LEN[k]*s;
  const th=p.tor*D2R,up=[Math.sin(th),-Math.cos(th)],fw=[Math.cos(th),Math.sin(th)];
  const P=p.S?add(p.S,up,-L.t):p.P,S=add(P,up,L.t),N=add(S,up,L.n);
  const hh=(p.tor+(p.hd||0))*D2R,H=add(N,[Math.sin(hh),-Math.cos(hh)],L.h);
  const j={P,S,N,H,up,fw,L},segs={},want=[];
  const T=v=>typeof v==="function"?v(j):v;
  (p.legs||[]).forEach((g,i)=>{
    const fa=(g.fa==null?4:g.fa)*D2R,fv=[Math.cos(fa),Math.sin(fa)];
    const A0=g.t?add(T(g.t),fv,-L.ft):T(g.a);
    const [K,A]=ik(P,A0,L.th,L.sh,g.k==null?1:g.k),Tt=add(A,fv,L.ft);
    j["k"+i]=K;j["a"+i]=A;j["t"+i]=Tt;want.push([A0,A,"leg"+i]);
    segs["leg"+i]={pts:[P,K,A,Tt],f:g.f,len:[L.th,L.sh,L.ft]};
  });
  (p.arms||[]).forEach((m,i)=>{
    const W0=T(m.w),[E,W]=ik(S,W0,L.ua,L.fa,m.e==null?-1:m.e);
    j["e"+i]=E;j["w"+i]=W;want.push([W0,W,"arm"+i]);
    segs["arm"+i]={pts:[S,E,W],f:m.f,len:[L.ua,L.fa]};
  });
  segs.trunk={pts:[P,S,N],len:[L.t,L.n]};
  return {j,segs,head:H,r:L.r,want};
}
// front view (lateral raise): a = upper-arm angle from vertical, b = forearm angle
function front(p,s){
  const L={};for(const k in LEN)L[k]=LEN[k]*s;
  const segs={},j={},cx=50,Sy=29,Py=Sy+L.t,Nb=[cx,Sy-2];
  const H=[cx,Nb[1]-L.n-L.h+2.5];
  segs.sh={pts:[[cx-9,Sy],Nb,[cx+9,Sy]],len:[9.2,9.2]};
  segs.sp={pts:[Nb,[cx,Py]],len:[Py-Nb[1]]};
  segs.pel={pts:[[cx-5,Py],[cx+5,Py]],len:[10]};
  [-1,1].forEach((sg,i)=>{
    const S=[cx+9*sg,Sy],a=p.a*D2R,b=p.b*D2R;
    const E=add(S,[sg*Math.sin(a),Math.cos(a)],L.ua),W=add(E,[sg*Math.sin(b),Math.cos(b)],L.fa);
    j["w"+i]=W;segs["arm"+i]={pts:[S,E,W],len:[L.ua,L.fa]};
    const Hp=[cx+5*sg,Py],A=[cx+7*sg,100],K=[(Hp[0]+A[0])/2,(Hp[1]+A[1])/2];
    segs["leg"+i]={pts:[Hp,K,A,[A[0]+6*sg,100.5]],len:[L.th,L.sh,6]};
  });
  return {j,segs,head:H,r:L.r,want:[]};
}
const FLOOR='<line class="gnd" x1="4" y1="102" x2="96" y2="102"/>';
const hang=j=>add(j.S,j.up,-30),hangF=j=>add(add(j.S,j.up,-29.5),j.fw,1.5);
const PLATE={type:"plate",at:"w0",r:15},DB={type:"db",at:"w0"},DBF={type:"db",at:"w1",f:1};
function bodyLine(toe,fa,ang,s){ // straight plank/push-up body from toes
  const ft=LEN.ft*s,A=add(toe,[Math.cos(fa*D2R),Math.sin(fa*D2R)],-ft),a=ang*D2R;
  return {S:add(A,[Math.cos(a),-Math.sin(a)],(LEN.th+LEN.sh+LEN.t)*s-.05),tor:90-ang};
}
const SPLIT=(dbs)=>({env:FLOOR,items:dbs?[DB]:[],poses:[
  {P:[43,61],tor:3,legs:[{t:[30,101],fa:52,f:1,k:1},{a:[61,100]}],arms:[{w:dbs?hangF:j=>add(add(j.S,j.up,-29.5),j.fw,3)}]},
  {P:[41,78],tor:5,legs:[{t:[30,101],fa:52,f:1,k:1},{a:[61,100]}],arms:[{w:dbs?hangF:j=>add(add(j.S,j.up,-29.5),j.fw,3)}]}]});
const PULL=(lean,el)=>({s:.85,env:'<line class="eq" x1="18" y1="10" x2="86" y2="10"/><line class="eq" x1="22" y1="10" x2="22" y2="4"/><line class="eq" x1="82" y1="10" x2="82" y2="4"/>',
  poses:[{S:[49,35.85],tor:3,legs:[{a:j=>add(j.P,[-5,33.5]),k:1}],arms:[{w:[56,10.5]}]},
         {S:[46,21],tor:lean,legs:[{a:j=>add(j.P,[-7,32]),k:1}],arms:[{w:[56,10.5],e:el}]}]});
const PRESS=(item)=>({s:.78,env:FLOOR,items:[item],poses:[
  {P:[49,66],tor:0,legs:[{a:[50,100]}],arms:[{w:j=>add(add(j.S,j.fw,item.type==="plate"?6:4),j.up,item.type==="plate"?1:2.5),e:1}]},
  {P:[49,66],tor:-2,legs:[{a:[50,100]}],arms:[{w:j=>add(add(j.S,j.up,23.5),j.fw,3)}]}]});
const RDL=(item)=>({env:FLOOR,items:[item],poses:[
  {P:[48,58],tor:3,legs:[{a:[51,100]}],arms:[{w:j=>add(add(j.S,j.up,-30.3),j.fw,2.5)}]},
  {P:[31,64],tor:68,hd:-12,legs:[{a:[50,100]}],arms:[{w:[57,85]}]}]});
const DEMO={
 "Back Squat":{env:FLOOR,items:[{type:"plate",at:"w0",r:15}],poses:[
   {P:[48,58],tor:5,legs:[{a:[50,100]}],arms:[{w:j=>add(add(j.S,j.fw,-4),j.up,1.5),e:1}]},
   {P:[33,82],tor:42,hd:-25,legs:[{a:[50,100]}],arms:[{w:j=>add(add(j.S,j.fw,-4),j.up,1.5),e:1}]}]},
 "DB Goblet Squat":{env:FLOOR,items:[{type:"db",at:"w0",v:1}],poses:[
   {P:[48,58],tor:3,legs:[{a:[50,100]}],arms:[{w:j=>add(add(j.S,j.fw,8),j.up,-9),e:-1}]},
   {P:[36,82],tor:24,hd:-14,legs:[{a:[50,100]}],arms:[{w:j=>add(add(j.S,j.fw,8),j.up,-9),e:-1}]}]},
 "Bench Press":{env:FLOOR+'<rect class="eqf" x="14" y="74" width="62" height="5" rx="2"/><line class="eq" x1="24" y1="79" x2="24" y2="102"/><line class="eq" x1="66" y1="79" x2="66" y2="102"/>',
   items:[{type:"plate",at:"w0",r:14}],poses:[
   {P:[58,70.5],tor:-90,legs:[{a:[77,100],k:1}],arms:[{w:[34,41.5]}]},
   {P:[58,70.5],tor:-90,legs:[{a:[77,100],k:1}],arms:[{w:[38,58],e:-1}]}]},
 "Barbell Row":{env:FLOOR,items:[{type:"plate",at:"w0",r:14}],poses:[
   {P:[38,62],tor:72,hd:-15,legs:[{a:[55,100]}],arms:[{w:j=>add(j.S,[-3,29.5])}]},
   {P:[38,62],tor:72,hd:-15,legs:[{a:[55,100]}],arms:[{w:j=>add(add(j.P,j.up,17),j.fw,5),e:1}]}]},
 "Romanian Deadlift":RDL({type:"plate",at:"w0",r:14}),
 "DB Romanian Deadlift":RDL(DB),
 "Hanging Leg Raise":{s:.85,env:'<line class="eq" x1="18" y1="10" x2="86" y2="10"/><line class="eq" x1="22" y1="10" x2="22" y2="4"/><line class="eq" x1="82" y1="10" x2="82" y2="4"/>',poses:[
   {S:[40,36.1],tor:2,legs:[{a:j=>add(j.P,[1.5,36.4]),k:1}],arms:[{w:[46,10.5]}]},
   {S:[39,36.4],tor:-8,legs:[{a:j=>add(j.P,[36.2,-3]),k:1}],arms:[{w:[46,10.5]}]}]},
 "Deadlift":{env:FLOOR,items:[{type:"plate",at:"w0",r:14}],poses:[
   {S:[58,57],tor:60,hd:-20,legs:[{a:[47,100]}],arms:[{w:[55,87.6]}]},
   {P:[48,57],tor:-3,legs:[{a:[49,100]}],arms:[{w:j=>add(add(j.S,j.up,-30.4),j.fw,3)}]}]},
 "Overhead Press":PRESS({type:"plate",at:"w0",r:14}),
 "DB Overhead Press":PRESS(DB),
 "Pull-ups":PULL(-12,-1),
 "Chin-ups":PULL(-6,-1),
 "Walking Lunges":SPLIT(false),
 "DB Split Squat":SPLIT(true),
 "Dips":{s:.85,env:'<line class="eq" x1="30" y1="54" x2="78" y2="54"/><line class="eq" x1="34" y1="54" x2="34" y2="102"/><line class="eq" x1="74" y1="54" x2="74" y2="102"/>'+FLOOR,poses:[
   {S:[56,28],tor:8,legs:[{a:j=>add(j.P,[-16,24]),k:1}],arms:[{w:[55,54]}]},

function buildPoses(name){
  const d=DEMO[name]||DEMO._generic,s=d.s||1;
  return {d,b:d.poses.map(p=>{const o=d.view==="front"?front(p,s):side(p,s);
    o.items=(d.items||[]).map(it=>{const at=typeof it.at==="function"?it.at(o.j):o.j[it.at];return {it,at}});return o})};
}
function demoSVG(name){
  const {d,b}=buildPoses(name),dur=(d.dur||2.4)+"s";
  const kt=d.breath?'keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"':'keyTimes="0;0.08;0.46;0.58;1" keySplines="0 0 1 1;.42 0 .58 1;0 0 1 1;.42 0 .58 1"';
  const seq=a=>d.breath?[a[0],a[1],a[0]]:[a[0],a[0],a[1],a[1],a[0]];
  const an=(attr,vals)=>{const v=seq(vals);return v.every(x=>x===v[0])?"":`<animate attributeName="${attr}" values="${v.join(";")}" ${kt} calcMode="spline" dur="${dur}" repeatCount="indefinite"/>`};
  const pts=a=>a.map(p=>R2(p[0])+","+R2(p[1])).join(" ");
  const poly=(cls,arr)=>`<polyline class="${cls}" points="${arr[0]}">${an("points",arr)}</polyline>`;
  const circ=(cls,c,r)=>`<circle class="${cls}" cx="${R2(c[0][0])}" cy="${R2(c[0][1])}" r="${r}">${an("cx",c.map(p=>R2(p[0])))}${an("cy",c.map(p=>R2(p[1])))}</circle>`;
  const item=k=>{const it=b[0].items[k].it,at=b.map(o=>o.items[k].at);
    if(it.type==="plate")return circ("pl",at,it.r);
    if(it.type==="ball")return circ(it.c||"dbf",at,it.r);
    if(it.type==="cable")return poly("eq",at.map(a=>pts([it.from,a])));
    if(it.type==="poly")return poly(it.cls,at.map(pts));
    if(it.type==="db"){const w=it.v?6:11,h=it.v?12:6;return `<rect class="dbf${it.f?" f":""}" x="${R2(at[0][0]-w/2)}" y="${R2(at[0][1]-h/2)}" width="${w}" height="${h}" rx="2.4">${an("x",at.map(p=>R2(p[0]-w/2)))}${an("y",at.map(p=>R2(p[1]-h/2)))}</rect>`}
    return ""};
  const keys=Object.keys(b[0].segs),far=keys.filter(k=>b[0].segs[k].f),near=keys.filter(k=>!b[0].segs[k].f);
  const order=[...far,...near.filter(k=>k!=="trunk"&&k.startsWith("leg")),...near.filter(k=>!k.startsWith("leg")&&!k.startsWith("arm")),...near.filter(k=>k.startsWith("arm"))];
  let body="";for(const k of order){const cls="b"+(b[0].segs[k].f?" f":"");body+=poly(cls,b.map(o=>pts(o.segs[k].pts)));
    if(k==="trunk"||k==="sp")body+=circ("hd",b.map(o=>o.head),R2(b[0].r))}
  // plates sit behind the body, dumbbells in front of it
  const pass=types=>b[0].items.map((x,k)=>types.includes(x.it.type)?item(k):"").join("");
  return `<svg class="fig" viewBox="0 0 100 110" aria-hidden="true">${d.env||""}${pass(["cable","plate"])}${body}${pass(["db","ball","poly"])}</svg>`;
}
//END ANIMJS
function honorMotion(root){
  if(!matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  (root||document).querySelectorAll("svg.fig").forEach(svg=>{try{svg.pauseAnimations();svg.setCurrentTime(1.2)}catch(e){}});
}
function openDemo(n){
  document.getElementById("zoomname").textContent=n;
  document.getElementById("zoomsvg").innerHTML=demoSVG(n);
  document.getElementById("zoom").classList.add("show");
  honorMotion(document.getElementById("zoom"));
}
document.getElementById("zoomclose").onclick=()=>document.getElementById("zoom").classList.remove("show");
document.getElementById("zoom").addEventListener("click",e=>{if(e.target.id==="zoom")e.currentTarget.classList.remove("show")});

const LS=k=>JSON.parse(localStorage.getItem(k)||"null"), SS=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let st=LS("rep_state")||{day:"A",where:"gym",sets:{},w:{},r:{}};
let last=LS("rep_last")||{}, hist=LS("rep_hist")||[];
const key=()=>st.where+st.day;
document.getElementById("dateline").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
function save(){SS("rep_state",st)}
function render(){
 const tabs=document.getElementById("tabs");tabs.innerHTML="";
 ["A","B","C"].forEach(d=>{const b=document.createElement("button");b.className="tab"+(st.day===d?" on":"");b.textContent="Day "+d;b.onclick=()=>{st.day=d;save();render()};tabs.appendChild(b)});
 document.querySelectorAll(".pill").forEach(p=>p.classList.toggle("on",p.dataset.w===st.where));
 const list=document.getElementById("list");list.innerHTML="";
 PLAN[st.where][st.day].forEach(([n,s,r],i)=>{
  const id=key()+i, done=(st.sets[id]||[]);
  const card=document.createElement("div");card.className="ex"+(done.filter(Boolean).length===s?" done":"");
  const lw=last[n];
  card.innerHTML=`<div class="exh"><div class="who"><button type="button" class="demo" aria-label="How to do ${n}">${demoSVG(n)}</button><div><div class="name">${n}</div><div class="scheme">${s} sets × ${r} reps</div>${lw?`<div class="last">Last: ${lw.w||"–"} lb · ${lw.r||""}</div>`:""}</div></div>
  <div class="wt"><input inputmode="decimal" placeholder="${lw&&lw.w?lw.w:"lb"}" value="${st.w[id]||""}"><small>lb</small></div></div><div class="sets"></div>`;
  card.querySelector("input").oninput=e=>{st.w[id]=e.target.value;save()};
  const sets=card.querySelector(".sets");
  for(let k=0;k<s;k++){
   const wrap=document.createElement("div");wrap.className="setwrap";
   const b=document.createElement("button");b.className="set"+(done[k]?" on":"");b.innerHTML=`<b>${k+1}</b>`;
   b.onclick=()=>{const a=st.sets[id]||[];a[k]=!a[k];st.sets[id]=a;save();if(a[k]){navigator.vibrate&&navigator.vibrate(30);startTimer(i<2&&st.where==="gym"?150:90)}render()};
   const ri=document.createElement("input");ri.className="repsin";ri.inputMode="numeric";ri.placeholder="reps";ri.value=(st.r[id]||[])[k]||"";
   ri.oninput=e=>{const a=st.r[id]||[];a[k]=e.target.value;st.r[id]=a;save()};
   wrap.appendChild(b);wrap.appendChild(ri);sets.appendChild(wrap);
  }
  card.querySelector(".demo").onclick=()=>openDemo(n);
  list.appendChild(card);
 });
 honorMotion();
 progress();renderHist();
}
function progress(){
 const ex=PLAN[st.where][st.day];let t=0,d=0;
 ex.forEach(([n,s],i)=>{t+=s;d+=(st.sets[key()+i]||[]).filter(Boolean).length});
 const p=t?d/t:0;document.getElementById("prog").style.strokeDashoffset=169.6*(1-p);document.getElementById("pct").textContent=Math.round(p*100)+"%";
}
function renderHist(){
 const h=document.getElementById("hist");
 h.innerHTML=hist.length?hist.slice(0,6).map(x=>`<div class="hrow"><b>${x.date} · Day ${x.day}</b> (${x.where==="gym"?"Life Time":"Home"}) · ${x.sets} sets<br>${x.items.join(" · ")}</div>`).join(""):`<div class="hrow">No sessions yet. Go get the first one.</div>`;
}
document.querySelectorAll(".pill").forEach(p=>p.onclick=()=>{st.where=p.dataset.w;save();render()});
let tEnd=0,tInt=null;const clock=document.getElementById("clock");
function startTimer(sec){tEnd=Date.now()+sec*1000;clearInterval(tInt);tick();tInt=setInterval(tick,250)}
function tick(){const left=Math.max(0,Math.round((tEnd-Date.now())/1000));clock.textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");clock.classList.toggle("go",left>0);
 if(left<=0&&tInt){clearInterval(tInt);tInt=null;if(tEnd){toast("Rest's over. Next set 🔥");navigator.vibrate&&navigator.vibrate([200,100,200])}tEnd=0}}
document.querySelectorAll(".tbtn").forEach(b=>b.onclick=()=>startTimer(+b.dataset.t));
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
const RELAY_URL="https://rep-relay.pages.dev/";
function sendToRep(payload){
 const ctrl=new AbortController();
 const timer=setTimeout(()=>ctrl.abort(),8000);
 fetch(RELAY_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload),keepalive:true,signal:ctrl.signal})
  .then(async res=>{
   let ok=res.ok;
   if(ok){try{const j=await res.json();if(j&&j.ok===false)ok=false}catch(e){}}
   toast(ok?"Sent to Rep ✅":"Couldn't send, tap Send to Rep");
  })
  .catch(()=>toast("Couldn't send, tap Send to Rep"))
  .finally(()=>clearTimeout(timer));
}
document.getElementById("finish").onclick=()=>{
 const day=st.day,where=st.where;
 const ex=PLAN[where][day];let sets=0;const items=[],lines=[],exercises=[];
 ex.forEach(([n,planned,scheme],i)=>{const id=where+day+i,c=(st.sets[id]||[]).filter(Boolean).length;sets+=c;
  const rawR=st.r[id]||[];
  const reps=rawR.filter(Boolean).join("/");
  const wnum=st.w[id]===""||st.w[id]==null?NaN:parseFloat(st.w[id]);
  const weight_lb=Number.isFinite(wnum)?wnum:null;
  const repsNums=rawR.map(v=>{const x=parseFloat(v);return Number.isFinite(x)?x:null}).filter(v=>v!==null);
  exercises.push({name:n,scheme:scheme||"",weight_lb,reps:repsNums,sets_done:c,sets_planned:planned});
  if(c){items.push(`${n} ${st.w[id]?st.w[id]+"lb ":""}${reps||c+" sets"}`);last[n]={w:st.w[id]||(last[n]&&last[n].w)||"",r:reps};
   lines.push(`${n}: ${st.w[id]?st.w[id]+" lb":"bodyweight/no wt"} × ${reps||"?"} (${c}/${planned} sets)`)}
  else lines.push(`${n}: skipped`)});
 if(!sets){toast("Check off a set first 😤");return}
 const dt=new Date();const entry={date:dt.toLocaleDateString(undefined,{month:"short",day:"numeric"}),iso:dt.toISOString().slice(0,10),day,where,sets,items,lines};
 hist.unshift(entry);
 SS("rep_hist",hist.slice(0,50));SS("rep_last",last);
 ex.forEach((_,i)=>{const id=where+day+i;delete st.sets[id];delete st.w[id];delete st.r[id]});
 st.day={A:"B",B:"C",C:"A"}[day];save();render();window.scrollTo({top:0,behavior:"smooth"});
 const summary=fmt(entry);
 openSheet(summary);
 sendToRep({type:"workout",date:entry.iso,day,where,exercises,summary});
};
function fmt(e){return `REP LOG ${e.iso||e.date} · Day ${e.day} (${e.where==="gym"?"Life Time":"Home"})\n`+(e.lines||e.items).join("\n")}
function openSheet(t){document.getElementById("sumtext").textContent=t;document.getElementById("sheet").classList.add("show")}
async function copy(t){try{await navigator.clipboard.writeText(t);toast("Copied. Paste it to Rep 📲")}catch(e){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();toast("Copied. Paste it to Rep 📲")}}
document.getElementById("sendrep").onclick=()=>copy(document.getElementById("sumtext").textContent);
document.getElementById("closesheet").onclick=()=>document.getElementById("sheet").classList.remove("show");
document.getElementById("copyall").onclick=()=>{if(!hist.length){toast("No sessions yet");return}openSheet(hist.map(fmt).join("\n\n"))};
render();
</script>
