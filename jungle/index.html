<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vine Runner">
<meta name="theme-color" content="#0b0b10">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>Vine Runner</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; color: #fff; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
    user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body { position: fixed; inset: 0; }
  #stage {
    position: fixed; inset: 0; box-sizing: border-box;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    display: flex; align-items: center; justify-content: center;
  }
  #fit { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #0b0b10; }
  #ui { position: fixed; inset: 0; z-index: 2; touch-action: none; }
  .btn {
    position: absolute; box-sizing: border-box; width: 76px; height: 76px;
    border-radius: 18px; background: rgba(255,255,255,0.16);
    border: 2px solid rgba(255,255,255,0.38); pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    transition: background 60ms linear;
  }
  .btn svg { width: 46%; height: 46%; fill: rgba(255,255,255,0.85); }
  .btn.on { background: rgba(255,214,64,0.45); border-color: rgba(255,240,160,0.8); }
  #bL { left: calc(env(safe-area-inset-left) + 14px); bottom: calc(env(safe-area-inset-bottom) + 16px); }
  #bR { left: calc(env(safe-area-inset-left) + 102px); bottom: calc(env(safe-area-inset-bottom) + 16px); }
  #bJ { right: calc(env(safe-area-inset-right) + 14px); bottom: calc(env(safe-area-inset-bottom) + 16px); width: 92px; height: 92px; border-radius: 50%; }
  #bJ span { font: 800 17px/1 -apple-system, system-ui, sans-serif; color: rgba(255,255,255,0.88); letter-spacing: 1px; }
  #bU { right: calc(env(safe-area-inset-right) + 26px); bottom: calc(env(safe-area-inset-bottom) + 202px); width: 68px; height: 68px; }
  #bD { right: calc(env(safe-area-inset-right) + 26px); bottom: calc(env(safe-area-inset-bottom) + 122px); width: 68px; height: 68px; }
  #bP { right: calc(env(safe-area-inset-right) + 10px); top: calc(env(safe-area-inset-top) + 10px); width: 52px; height: 52px; border-radius: 14px; }
  #rotate {
    position: fixed; inset: 0; z-index: 10; display: none; background: #0b0b10;
    flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    font: 700 22px/1.3 -apple-system, system-ui, sans-serif; color: #f0d040; text-align: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #rotate small { display: block; color: #9ad07a; font-weight: 500; font-size: 15px; }
  #rotate svg { width: 96px; height: 96px; animation: tilt 1.8s ease-in-out infinite; }
  @keyframes tilt { 0%,30% { transform: rotate(0deg); } 60%,100% { transform: rotate(-90deg); } }
</style>
</head>
<body>
<div id="stage"><div id="fit"><canvas id="screen" width="320" height="180"></canvas></div></div>
<div id="ui">
  <div class="btn" id="bL"><svg viewBox="0 0 10 10"><polygon points="7,1 2,5 7,9"/></svg></div>
  <div class="btn" id="bR"><svg viewBox="0 0 10 10"><polygon points="3,1 8,5 3,9"/></svg></div>
  <div class="btn" id="bU"><svg viewBox="0 0 10 10"><polygon points="1,7 5,2 9,7"/></svg></div>
  <div class="btn" id="bD"><svg viewBox="0 0 10 10"><polygon points="1,3 5,8 9,3"/></svg></div>
  <div class="btn" id="bJ"><span>JUMP</span></div>
  <div class="btn" id="bP"><svg viewBox="0 0 10 10"><rect x="2" y="1.5" width="2.2" height="7"/><rect x="5.8" y="1.5" width="2.2" height="7"/></svg></div>
</div>
<div id="rotate">
  <svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2" fill="none" stroke="#f0d040" stroke-width="1.6"/><circle cx="12" cy="18.5" r="1" fill="#f0d040"/></svg>
  <div>Rotate your phone<small>Vine Runner plays in landscape</small></div>
</div>
<script src="game.js"></script>
</body>
</html>
